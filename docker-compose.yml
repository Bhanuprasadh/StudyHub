version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: studyhub_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyhub_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-studyhub_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyhub} -d ${POSTGRES_DB:-studyhub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyhub_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-studyhub}:${POSTGRES_PASSWORD:-studyhub_secure_pwd}@db:5432/${POSTGRES_DB:-studyhub_db}
      SECRET_KEY: ${SECRET_KEY:-studyhub_prod_jwt_secret_key_change_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_studyhub_demo}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-studyhub_secret_demo_key}
      RAZORPAY_ENABLED: "True"
      EMAILS_ENABLED: ${EMAILS_ENABLED:-False}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-notifications@studyhub.edu}
      SMTP_FROM_NAME: "StudyHub Academic Platform"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyhub_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
